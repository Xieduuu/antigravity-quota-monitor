<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Antigravity 额度与上下文监控</title>
  <style>
    :root {
      --bg-canvas: var(--color-background-primary, #0f1218);
      --bg-card: var(--color-background-secondary, #161a23);
      --bg-elevated: var(--color-background-tertiary, #1d2230);
      --bg-hover: rgba(148, 163, 184, 0.09);
      --border-subtle: var(--color-border-primary, rgba(255, 255, 255, 0.08));
      --border-strong: rgba(255, 255, 255, 0.15);
      --text-primary: var(--color-text-primary, #eef2f8);
      --text-secondary: var(--color-text-secondary, #98a2b3);
      --text-muted: var(--color-text-tertiary, #667085);

      --accent: #60a5fa;
      --accent-soft: rgba(96, 165, 250, 0.14);
      --emerald: #34d399;
      --emerald-soft: rgba(52, 211, 153, 0.14);
      --amber: #fbbf24;
      --amber-soft: rgba(251, 191, 36, 0.15);
      --rose: #fb7185;
      --rose-soft: rgba(251, 113, 133, 0.15);
      --violet: #a78bfa;
      --indigo: #818cf8;

      --cal-0: rgba(148, 163, 184, 0.08);
      --cal-1: rgba(96, 165, 250, 0.22);
      --cal-2: rgba(96, 165, 250, 0.42);
      --cal-3: rgba(99, 102, 241, 0.66);
      --cal-4: rgba(52, 211, 153, 0.82);

      --radius-lg: 14px;
      --radius-md: 10px;
      --radius-sm: 7px;
      --shadow-card: 0 1px 2px rgba(0, 0, 0, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.03);
      --font-main: var(--font-sans, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif);
    }

    html[data-theme="light"] {
      --bg-canvas: var(--color-background-primary, #f5f7fb);
      --bg-card: var(--color-background-secondary, #ffffff);
      --bg-elevated: var(--color-background-tertiary, #f0f3f9);
      --bg-hover: rgba(15, 23, 42, 0.05);
      --border-subtle: var(--color-border-primary, rgba(15, 23, 42, 0.09));
      --border-strong: rgba(15, 23, 42, 0.18);
      --text-primary: var(--color-text-primary, #111827);
      --text-secondary: var(--color-text-secondary, #4b5563);
      --text-muted: var(--color-text-tertiary, #6b7280);
      --emerald: #059669;
      --emerald-soft: rgba(5, 150, 105, 0.12);
      --amber: #d97706;
      --amber-soft: rgba(217, 119, 6, 0.12);
      --rose: #e11d48;
      --rose-soft: rgba(225, 29, 72, 0.12);
      --accent: #2563eb;
      --accent-soft: rgba(37, 99, 235, 0.10);
      --cal-0: rgba(15, 23, 42, 0.05);
      --cal-1: rgba(37, 99, 235, 0.16);
      --cal-2: rgba(37, 99, 235, 0.34);
      --cal-3: rgba(79, 70, 229, 0.58);
      --cal-4: rgba(5, 150, 105, 0.78);
      --shadow-card: 0 1px 3px rgba(15, 23, 42, 0.06);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-main);
      background: var(--bg-canvas);
      color: var(--text-primary);
      font-size: 13px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
      padding: 12px;
      min-height: 100vh;
    }

    .tabular {
      font-variant-numeric: tabular-nums;
    }

    /* 顶部栏 */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .brand-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--emerald);
      box-shadow: 0 0 8px var(--emerald);
      flex-shrink: 0;
    }

    .brand-title {
      font-size: 13.5px;
      font-weight: 600;
      letter-spacing: -0.01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .brand-sub {
      font-size: 11px;
      color: var(--text-muted);
      white-space: nowrap;
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .icon-btn, .pill-btn {
      appearance: none;
      border: 1px solid var(--border-subtle);
      background: var(--bg-card);
      color: var(--text-secondary);
      border-radius: 8px;
      cursor: pointer;
      font-family: inherit;
      font-size: 11.5px;
      transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
    }

    .pill-btn {
      padding: 4px 8px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .icon-btn {
      width: 28px;
      height: 28px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .icon-btn:hover, .pill-btn:hover {
      background: var(--bg-elevated);
      color: var(--text-primary);
      border-color: var(--border-strong);
    }

    .icon-btn:active, .pill-btn:active {
      transform: scale(0.96);
    }

    .icon-btn.spinning svg {
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* 主网格：侧栏单列 / 全局宽屏双列 */
    .layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      max-width: 1120px;
      margin: 0 auto;
    }

    @media (min-width: 680px) {
      body {
        padding: 18px 22px;
      }
      .layout {
        grid-template-columns: minmax(320px, 1.05fr) minmax(320px, 0.95fr);
        align-items: start;
        gap: 16px;
      }
    }

    .col {
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-width: 0;
    }

    /* 卡片容器 */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-card);
      overflow: hidden;
    }

    .card.allow-overflow {
      overflow: visible;
    }

    .card-header {
      padding: 12px 14px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .card-title-row {
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
    }

    .card-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 2px 6px;
      border-radius: 999px;
      font-size: 10.5px;
      font-weight: 500;
      background: var(--bg-elevated);
      color: var(--text-secondary);
      border: 1px solid var(--border-subtle);
      white-space: nowrap;
    }

    .badge.ok { background: var(--emerald-soft); color: var(--emerald); border-color: transparent; }
    .badge.warn { background: var(--amber-soft); color: var(--amber); border-color: transparent; }
    .badge.danger { background: var(--rose-soft); color: var(--rose); border-color: transparent; }
    .badge.accent { background: var(--accent-soft); color: var(--accent); border-color: transparent; }

    /* Google Gemini 5h & 周额度外显双卡 */
    .hero-quotas {
      padding: 0 14px 12px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .quota-tile {
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 10px 11px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: border-color 0.15s ease;
    }

    .quota-tile:hover {
      border-color: var(--border-strong);
    }

    .quota-tile-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .quota-label {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .quota-sync-link {
      appearance: none;
      border: none;
      background: transparent;
      color: var(--accent);
      font-family: inherit;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      padding: 2px 5px;
      border-radius: 5px;
      transition: background 0.15s ease;
    }

    .quota-sync-link:hover {
      background: var(--accent-soft);
    }

    .quota-sync-link:disabled {
      opacity: 0.65;
      cursor: default;
    }

    .quota-tile-mid {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .ring-wrap {
      position: relative;
      width: 42px;
      height: 42px;
      flex-shrink: 0;
    }

    .ring-wrap svg {
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }

    .ring-track {
      fill: none;
      stroke: rgba(148, 163, 184, 0.16);
      stroke-width: 4.5;
    }

    .ring-fill {
      fill: none;
      stroke-width: 4.5;
      stroke-linecap: round;
      transition: stroke-dashoffset 0.45s cubic-bezier(0.22, 1, 0.36, 1), stroke 0.25s ease;
    }

    .ring-center {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10.5px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .quota-meta {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .quota-big {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text-primary);
      line-height: 1.15;
    }

    .quota-big.muted {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .quota-sub {
      font-size: 10.8px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .quota-tile-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
      padding-top: 6px;
      border-top: 1px dashed var(--border-subtle);
      font-size: 10.8px;
      color: var(--text-secondary);
    }

    /* 折叠触发条 */
    .expand-bar {
      width: 100%;
      appearance: none;
      border: none;
      border-top: 1px solid var(--border-subtle);
      background: rgba(148, 163, 184, 0.03);
      color: var(--text-secondary);
      padding: 8px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: inherit;
      font-size: 11.5px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .expand-bar:hover {
      background: var(--bg-hover);
      color: var(--text-primary);
    }

    .chevron {
      transition: transform 0.2s ease;
      display: inline-flex;
    }

    .expanded .chevron {
      transform: rotate(180deg);
    }

    .drawer {
      display: none;
      border-top: 1px solid var(--border-subtle);
      padding: 12px 14px 14px;
    }

    .drawer.open {
      display: block;
    }

    /* 额外模型额度列表（Claude & GPT / Argon） */
    .section-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 0.02em;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .section-label > span:last-child {
      font-weight: 500;
      letter-spacing: 0;
    }

    .extra-group {
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 9px 11px;
      margin-bottom: 8px;
    }

    .extra-group-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .extra-group-name {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .bucket-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 5px 0;
    }

    .bucket-row + .bucket-row {
      border-top: 1px dashed var(--border-subtle);
    }

    .bucket-row-left {
      display: flex;
      flex-direction: column;
      gap: 1px;
      min-width: 0;
    }

    .bucket-row-title {
      font-size: 11.8px;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .bucket-row-meta {
      font-size: 10.6px;
      color: var(--text-muted);
    }

    .bucket-row-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .mini-ring {
      width: 22px;
      height: 22px;
      transform: rotate(-90deg);
    }

    .mini-pct {
      font-size: 12.5px;
      font-weight: 700;
      min-width: 44px;
      text-align: right;
    }

    /* Token 用量总览 */
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin: 12px 0 10px;
    }

    .summary-cell {
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      padding: 8px 10px;
    }

    .summary-val {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.01em;
    }

    .summary-key {
      font-size: 10.8px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .cache-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11.5px;
      color: var(--text-secondary);
      margin-bottom: 12px;
      padding: 6px 10px;
      background: var(--bg-elevated);
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-subtle);
    }

    /* 每日用量日历 */
    .cal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .cal-nav {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .cal-nav button {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      border: 1px solid var(--border-subtle);
      background: var(--bg-elevated);
      color: var(--text-secondary);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
    }

    .cal-nav button:hover {
      color: var(--text-primary);
      border-color: var(--border-strong);
    }

    .cal-month-title {
      font-size: 12px;
      font-weight: 600;
      min-width: 78px;
      text-align: center;
    }

    .cal-weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      margin-bottom: 4px;
      text-align: center;
      font-size: 10.5px;
      color: var(--text-muted);
    }

    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
    }

    .cal-day {
      aspect-ratio: 1.25 / 1;
      border-radius: 6px;
      border: 1px solid transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 500;
      color: var(--text-secondary);
      cursor: pointer;
      transition: transform 0.1s ease, border-color 0.15s ease;
      background: var(--cal-0);
    }

    .cal-day.empty {
      background: transparent;
      cursor: default;
    }

    .cal-day.lvl-1 { background: var(--cal-1); color: var(--text-primary); }
    .cal-day.lvl-2 { background: var(--cal-2); color: var(--text-primary); }
    .cal-day.lvl-3 { background: var(--cal-3); color: #ffffff; }
    .cal-day.lvl-4 { background: var(--cal-4); color: #06281e; font-weight: 700; }

    .cal-day.today {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent);
    }

    .cal-day.selected {
      border-color: var(--text-primary);
      transform: scale(1.04);
    }

    .cal-detail {
      margin-top: 8px;
      padding: 8px 10px;
      border-radius: var(--radius-sm);
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      font-size: 11px;
      color: var(--text-secondary);
    }

    /* 当前会话上下文卡片（复刻截图二的高质感交互） */
    .context-hero {
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .context-hero:hover {
      background: var(--bg-hover);
    }

    .context-hero-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .ctx-ring-wrap {
      position: relative;
      width: 48px;
      height: 48px;
      flex-shrink: 0;
    }

    .ctx-ring-wrap svg {
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }

    .ctx-ring-center {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
    }

    .ctx-info {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .ctx-headline {
      display: flex;
      align-items: baseline;
      gap: 6px;
      flex-wrap: wrap;
    }

    .ctx-pct-text {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .ctx-ratio {
      font-size: 11.5px;
      color: var(--text-secondary);
    }

    .ctx-model-line {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .session-bar {
      padding: 0 14px 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      position: relative;
    }

    /* 自定义暗色/浅色融合会话选择器（替代丑陋的 Windows 原生白底 select） */
    .session-picker {
      position: relative;
      flex: 1;
      min-width: 0;
    }

    .session-trigger {
      width: 100%;
      appearance: none;
      background: var(--bg-elevated);
      color: var(--text-primary);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 6px 9px;
      font-family: inherit;
      font-size: 11.8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 7px;
      cursor: pointer;
      text-align: left;
      transition: border-color 0.15s ease, background 0.15s ease;
    }

    .session-trigger:hover {
      border-color: var(--border-strong);
      background: var(--bg-hover);
    }

    .session-picker.open .session-trigger {
      border-color: var(--accent);
    }

    .session-trigger-left {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      flex: 1;
    }

    .live-indicator {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--emerald);
      flex-shrink: 0;
    }

    .session-trigger-title {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-weight: 500;
    }

    .session-trigger-caret {
      color: var(--text-muted);
      flex-shrink: 0;
      display: inline-flex;
      transition: transform 0.18s ease;
    }

    .session-picker.open .session-trigger-caret {
      transform: rotate(180deg);
    }

    .session-menu {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      right: 0;
      z-index: 60;
      background: var(--bg-card);
      border: 1px solid var(--border-strong);
      border-radius: 10px;
      box-shadow: 0 14px 34px rgba(0, 0, 0, 0.48);
      padding: 4px;
      max-height: 248px;
      overflow-y: auto;
      display: none;
    }

    .session-picker.open .session-menu {
      display: block;
    }

    .session-menu::-webkit-scrollbar {
      width: 5px;
    }

    .session-menu::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.25);
      border-radius: 999px;
    }

    .session-option {
      width: 100%;
      appearance: none;
      border: none;
      background: transparent;
      color: var(--text-primary);
      font-family: inherit;
      text-align: left;
      padding: 7px 8px;
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      cursor: pointer;
      transition: background 0.12s ease;
    }

    .session-option:hover {
      background: var(--bg-hover);
    }

    .session-option.active {
      background: var(--accent-soft);
    }

    .session-option-main {
      min-width: 0;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .session-option-title {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11.8px;
      font-weight: 500;
      color: var(--text-primary);
    }

    .session-option-title span:last-child {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .session-option-sub {
      font-size: 10.4px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .session-option-right {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
      font-size: 10.8px;
      color: var(--text-secondary);
    }

    .session-check {
      color: var(--accent);
      font-weight: 700;
      font-size: 11px;
    }

    .follow-toggle {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      color: var(--text-secondary);
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
    }

    .follow-toggle input {
      accent-color: var(--accent);
      cursor: pointer;
    }

    /* 上下文三段堆叠条 */
    .seg-bar {
      height: 6px;
      border-radius: 999px;
      background: rgba(148, 163, 184, 0.14);
      overflow: hidden;
      display: flex;
      gap: 1px;
      margin-bottom: 10px;
    }

    .seg-sys { background: var(--violet); }
    .seg-dial { background: var(--accent); }
    .seg-tools { background: var(--emerald); }

    .breakdown-list {
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-bottom: 12px;
    }

    .breakdown-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11.8px;
      color: var(--text-secondary);
    }

    .breakdown-left {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 2px;
      flex-shrink: 0;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }

    .stat-box {
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      padding: 8px 10px;
    }

    .stat-box-label {
      font-size: 10.6px;
      color: var(--text-muted);
      margin-bottom: 3px;
    }

    .stat-box-val {
      font-size: 13.5px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .stat-box-val.emerald { color: var(--emerald); }

    /* 模型分布条 */
    .model-list {
      display: flex;
      flex-direction: column;
      gap: 7px;
      margin-top: 10px;
    }

    .model-item {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .model-item-top {
      display: flex;
      justify-content: space-between;
      font-size: 11.3px;
      color: var(--text-secondary);
    }

    .model-bar-track {
      height: 4px;
      border-radius: 999px;
      background: rgba(148, 163, 184, 0.14);
      overflow: hidden;
    }

    .model-bar-fill {
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--accent), var(--emerald));
    }

    .empty-state {
      padding: 20px 14px;
      text-align: center;
      color: var(--text-muted);
      font-size: 12px;
    }

    .footnote {
      font-size: 10.5px;
      color: var(--text-muted);
      text-align: center;
      padding: 4px 0 2px;
    }

    /* 检查更新弹窗 */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(5, 8, 15, 0.65);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 14px;
      z-index: 100;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal {
      width: 100%;
      max-width: 360px;
      background: var(--bg-card);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-lg);
      padding: 15px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
    }

    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }

    .modal-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .update-ver-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: 9px;
      padding: 8px 10px;
      margin-bottom: 10px;
      font-size: 11.8px;
    }

    .update-status {
      font-size: 11.6px;
      line-height: 1.5;
      color: var(--text-secondary);
      margin-bottom: 10px;
    }

    .update-status.ok { color: var(--emerald); }
    .update-status.err { color: var(--rose); }

    .update-notes {
      max-height: 160px;
      overflow-y: auto;
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 8px 10px;
      margin-bottom: 12px;
      font-size: 11.2px;
      line-height: 1.55;
      color: var(--text-secondary);
      white-space: pre-wrap;
      word-break: break-word;
    }

    .modal-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
    }

    .btn {
      appearance: none;
      border-radius: 8px;
      padding: 6px 12px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid var(--border-subtle);
      background: var(--bg-elevated);
      color: var(--text-secondary);
      transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    }

    .btn:hover:not(:disabled) {
      color: var(--text-primary);
      border-color: var(--border-strong);
    }

    .btn:disabled {
      opacity: 0.55;
      cursor: default;
    }

    .btn-primary {
      background: var(--accent);
      border-color: transparent;
      color: #ffffff;
    }

    .btn-primary:hover:not(:disabled) {
      filter: brightness(1.08);
      color: #ffffff;
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="brand">
      <span class="brand-dot" id="liveDot"></span>
      <span class="brand-title">额度与上下文监控</span>
      <span class="brand-sub tabular" id="updatedAtLabel">加载中…</span>
    </div>
    <div class="topbar-actions">
      <button class="pill-btn tabular" id="unitToggleBtn" title="切换 Token 数字显示单位">K/M/B</button>
      <button class="icon-btn" id="updateBtn" title="检查插件更新">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
      </button>
      <button class="icon-btn" id="refreshBtn" title="立即刷新">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12a9 9 0 1 1-2.64-6.36L21 8"/><path d="M21 3v5h-5"/>

      </button>

  </div>

  <div class="layout">
    <!-- 左列：额度与余量主卡 -->
    <div class="col">
      <section class="card" id="quotaCard">
        <div class="card-header">
          <div class="card-title-row">
            <span class="card-title">Gemini Models 额度</span>
            <span class="badge" id="quotaSourceBadge" role="status">额度待同步</span>
          </div>
        </div>

        <!-- 外显常驻区：Google 5h & 周额度 -->
        <div class="hero-quotas" id="primaryQuotas"></div>

        <!-- 点击展开额外额度、Token 汇总与每日日历 -->
        <button class="expand-bar" id="quotaExpandBtn" type="button">
          <span>展开详情 · Claude &amp; GPT · Argon · 每日用量日历</span>
          <span class="chevron">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">

        <div class="drawer" id="quotaDrawer">
          <div class="section-label">
            <span>额外模型额度池</span>
          </div>
          <div id="extraQuotas"></div>

          <div class="section-label" style="margin-top: 12px;">
            <span>全局 Token 用量</span>
            <span id="convCountBadge"></span>
          </div>
          <div class="summary-grid" id="summaryGrid"></div>
          <div class="cache-row" id="todayCacheRow"></div>

          <div class="cal-header">
            <span class="section-label" style="margin: 0;">当月每日用量</span>
            <div class="cal-nav">
              <button type="button" id="prevMonthBtn" title="上个月">‹</button>
              <span class="cal-month-title tabular" id="calMonthTitle">----年--月</span>
              <button type="button" id="nextMonthBtn" title="下个月">›</button>
            </div>
          </div>
          <div class="cal-weekdays">
            <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span>
          </div>
          <div class="cal-grid" id="calGrid"></div>
          <div class="cal-detail tabular" id="calDetail">点击任意日期查看当日精确明细</div>

          <div id="modelBreakdownWrap" style="margin-top: 12px;"></div>
        </div>
      </section>
    </div>

    <!-- 右列：当前会话上下文卡片 -->
    <div class="col">
      <section class="card allow-overflow" id="contextCard">
        <div class="context-hero" id="contextHero">
          <div class="context-hero-left">
            <div class="ctx-ring-wrap">
              <svg viewBox="0 0 48 48">
                <circle class="ring-track" cx="24" cy="24" r="19"/>
                <circle class="ring-fill" id="ctxRingFill" cx="24" cy="24" r="19" stroke-dasharray="119.38" stroke-dashoffset="119.38" stroke="#34d399"/>

            <button type="button" class="session-trigger" id="sessionTrigger" aria-haspopup="listbox" aria-expanded="false">
              <span class="session-trigger-left">
                <span class="live-indicator" id="sessionLiveDot" style="display:none;"></span>
                <span class="session-trigger-title" id="sessionTriggerTitle">加载会话…</span>
              </span>
              <span class="session-trigger-caret">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="6 9 12 15 18 9"/>

        <div class="drawer open" id="contextDrawer">
          <div id="contextDetailsBody"></div>

      <div class="footnote">零模型 Token 消耗 · 纯本地离线统计</div>
    </div>
  </div>

  <!-- 手动检查更新弹窗 -->
  <div class="modal-backdrop" id="updateModalBackdrop">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="updateModalTitle">
      <div class="modal-head">
        <span class="modal-title" id="updateModalTitle">检查插件更新</span>
        <span class="badge tabular" id="updateBadge">GitHub Release</span>
      </div>
      <div class="update-ver-row tabular" id="updateVerRow">
        <span>当前版本：<strong>v0.2.0</strong></span>
        <span id="updateLatestText" style="color:var(--text-muted)">检查中…</span>
      </div>
      <div class="update-status" id="updateStatusText">正在连接 GitHub 查询最新版本…</div>
      <div class="update-notes" id="updateNotesBox" style="display:none;"></div>
      <div class="modal-actions">
        <button type="button" class="btn" id="updateRecheckBtn">重新检查</button>
        <button type="button" class="btn" id="updateCloseBtn">关闭</button>
        <button type="button" class="btn btn-primary" id="updateApplyBtn" style="display:none;">一键更新</button>
      </div>
    </div>
  </div>

  <script>
    (function () {
      "use strict";

      // ================================================================
      // 1. MCP Apps (SEP-1865 / 2026-01-26) 宿主桥接 + 本地预览降级适配
      // ================================================================
      const isEmbedded = window.parent && window.parent !== window;
      const isHttpPreview = !isEmbedded && location.protocol.startsWith("http");

      let rpcSeq = 1;
      const pendingRpc = new Map();
      let mcpConnected = false;

      function applyHostContext(ctx) {
        if (!ctx || typeof ctx !== "object") return;
        if (ctx.theme === "light" || ctx.theme === "dark") {
          document.documentElement.setAttribute("data-theme", ctx.theme);
        }
        const vars = ctx.styles && ctx.styles.variables;
        if (vars && typeof vars === "object") {
          const rootStyle = document.documentElement.style;
          for (const [k, v] of Object.entries(vars)) {
            if (typeof k === "string" && k.startsWith("--") && typeof v === "string") {
              rootStyle.setProperty(k, v);
            }
          }
        }
      }

      function postToHost(payload) {
        if (!isEmbedded) return;
        window.parent.postMessage(payload, "*");
      }

      function sendHostRequest(method, params, timeoutMs) {
        return new Promise((resolve, reject) => {
          const id = rpcSeq++;
          const timer = setTimeout(() => {
            pendingRpc.delete(id);
            reject(new Error("Host RPC timeout: " + method));
          }, timeoutMs || 12000);
          pendingRpc.set(id, { resolve, reject, timer });
          postToHost({ jsonrpc: "2.0", id, method, params: params || {} });
        });
      }

      function callServerTool(name, args) {
        if (isEmbedded && mcpConnected) {
          const timeoutMs = name === "app_apply_update" ? 35000 : (name === "app_check_update" ? 18000 : 12000);
          return sendHostRequest("tools/call", { name, arguments: args || {} }, timeoutMs).then((res) => {
            if (res && res.structuredContent) return res.structuredContent;
            return null;
          });
        }
        if (isHttpPreview) {
          if (name === "app_get_dashboard") {
            const qs = new URLSearchParams();
            if (args && args.conversationId) qs.set("conversationId", args.conversationId);
            if (args && args.year) qs.set("year", String(args.year));
            if (args && args.month) qs.set("month", String(args.month));
            if (args && args.forceQuotaRefresh) qs.set("forceQuotaRefresh", "true");
            return fetch("/api/dashboard?" + qs.toString(), { cache: "no-store" }).then((r) => {
              if (!r.ok) throw new Error("Dashboard HTTP " + r.status);
              return r.json();
            });
          }
          if (name === "app_update_preferences") {
            return fetch("/api/preferences", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(args || {}),
            }).then((r) => r.json());
          }
          if (name === "app_check_update") {
            return fetch("/api/check-update", { cache: "no-store" }).then((r) => r.json());
          }
          if (name === "app_apply_update") {
            return fetch("/api/apply-update", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(args || {}),
            }).then((r) => r.json());
          }
        }
        if (name === "app_check_update") {
          return Promise.resolve({ ok: true, currentVersion: "0.2.0", latestVersion: "0.2.0", hasUpdate: false, releaseTitle: "离线演示模式" });
        }
        return Promise.resolve(buildOfflineDemoData());
      }

      window.addEventListener("message", (event) => {
        const msg = event.data;
        if (!msg || typeof msg !== "object" || msg.jsonrpc !== "2.0") return;

        // 响应宿主 ping
        if (msg.method === "ping" && msg.id !== undefined) {
          postToHost({ jsonrpc: "2.0", id: msg.id, result: {} });
          return;
        }

        // 处理宿主返回结果
        if (msg.id !== undefined && pendingRpc.has(msg.id)) {
          const entry = pendingRpc.get(msg.id);
          pendingRpc.delete(msg.id);
          clearTimeout(entry.timer);
          if (msg.error) {
            entry.reject(new Error(msg.error.message || "RPC Error"));
          } else {
            entry.resolve(msg.result);
          }
          return;
        }

        // 处理宿主推送通知
        if (msg.method === "ui/notifications/host-context-changed") {
          applyHostContext(msg.params);
        } else if (msg.method === "ui/notifications/tool-result") {
          const data = msg.params && msg.params.structuredContent;
          if (data) {
            state.dashboard = data;
            renderAll();
          }
        }
      });

      function reportSize() {
        if (!isEmbedded || !mcpConnected) return;
        const h = Math.ceil(document.documentElement.scrollHeight);
        postToHost({
          jsonrpc: "2.0",
          method: "ui/notifications/size-changed",
          params: { height: h, width: document.documentElement.clientWidth },
        });
      }

      // ================================================================
      // 2. 应用状态与格式化工具
      // ================================================================
      const state = {
        dashboard: null,
        quotaExpanded: window.innerWidth >= 680,
        contextExpanded: true,
        selectedConversationId: null,
        calendarYear: null,
        calendarMonth: null,
        selectedDay: null,
        quotaSyncing: false,
        refreshRequestId: 0,
        refreshTimer: null,
      };

      function unitMode() {
        return (state.dashboard && state.dashboard.preferences && state.dashboard.preferences.unitMode) || "compact";
      }

      function fmtTokens(n, forceCompact) {
        const val = Number(n || 0);
        if (!forceCompact && unitMode() === "exact") {
          return val.toLocaleString("en-US");
        }
        if (val >= 1e9) return (val / 1e9).toFixed(2).replace(/\.00$/, "") + "B";
        if (val >= 1e6) return (val / 1e6).toFixed(2).replace(/\.00$/, "") + "M";
        if (val >= 1e3) return (val / 1e3).toFixed(1).replace(/\.0$/, "") + "K";
        return String(Math.round(val));
      }

      function fmtDuration(sec) {
        const s = Math.max(0, Math.round(Number(sec || 0)));
        if (s < 60) return s + "秒";
        const m = Math.floor(s / 60);
        const r = s % 60;
        if (m < 60) return m + "分" + (r > 0 ? r + "秒" : "");
        const h = Math.floor(m / 60);
        const rm = m % 60;
        return h + "小时" + (rm > 0 ? rm + "分" : "");
      }

      function fmtCountdown(sec) {
        if (sec === null || sec === undefined) return "";
        const s = Math.max(0, Math.floor(Number(sec)));
        if (s <= 0) return "已到重置点";
        const d = Math.floor(s / 86400);
        const h = Math.floor((s % 86400) / 3600);
        const m = Math.floor((s % 3600) / 60);
        if (d > 0) return d + "d " + h + "h";
        if (h > 0) return h + "h " + m + "m";
        return Math.max(1, m) + "m";
      }

      function quotaColor(pct) {
        if (pct === null || pct === undefined) return "#64748b";
        if (pct >= 50) return "var(--emerald)";
        if (pct >= 20) return "var(--amber)";
        return "var(--rose)";
      }

      function contextColor(pct) {
        if (pct < 55) return "var(--emerald)";
        if (pct < 80) return "var(--amber)";
        return "var(--rose)";
      }

      function escHtml(str) {
        return String(str || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      // ================================================================
      // 3. 渲染函数
      // ================================================================
      function renderAll() {
        const d = state.dashboard;
        if (!d) return;

        document.getElementById("updatedAtLabel").textContent = d.localTime || "";
        document.getElementById("unitToggleBtn").textContent = unitMode() === "compact" ? "K/M/B" : "精确数";

        renderQuotas(d);
        renderUsageSummary(d);
        renderCalendar(d);
        renderModelBreakdown(d);
        renderContextCard(d);
        syncExpandStates();
        requestAnimationFrame(reportSize);
      }

      function renderQuotas(d) {
        const buckets = (d.quotas && d.quotas.buckets) || [];
        const qSource = (d.quotas && d.quotas.source) || "unavailable";
        const badgeEl = document.getElementById("quotaSourceBadge");
        badgeEl.textContent = {
          antigravity: "客户端同步",
          external: "外部同步",
          demo: "演示数据",
        }[qSource] || "额度暂不可用";
        badgeEl.className = qSource === "antigravity" || qSource === "external" ? "badge ok" : "badge";

        const primary = buckets.filter((b) => b.primary);
        const claudeGpt = buckets.filter((b) => b.group === "claude_gpt");
        const argon = buckets.filter((b) => b.group === "argon");
        const syncButton = '<button type="button" class="quota-sync-link" data-quota-sync title="同步全部额度">同步</button>';

        const circum = 2 * Math.PI * 16; // r=16 -> 100.53
        const primaryHtml = primary.map((b) => {
          const quota = b.quota;
          const pct = quota.remainingPct;
          const color = quotaColor(pct);
          const usageText = "本机近" + b.shortLabel + " " + fmtTokens(b.windowUsage.totalTokens, true) + " tok";

          if (pct === null) {
            return `
              <div class="quota-tile">
                <div class="quota-tile-top">
                  <span class="quota-label">${escHtml(b.label)}</span>
                  ${syncButton}
                </div>
                <div class="quota-meta" style="padding: 3px 0;">
                  <div class="quota-big muted">暂不可用</div>
                  <div class="quota-sub tabular" title="${escHtml(usageText)}">${escHtml(usageText)}</div>
                </div>
                <div class="quota-tile-foot tabular">
                  <span>${b.windowUsage.calls} 次调用</span>
                  <span>输出 ${fmtTokens(b.windowUsage.output, true)}</span>
                </div>
              </div>
            `;
          }

          const offset = circum * (1 - Math.max(0, Math.min(100, pct)) / 100);
          const bigText = pct.toFixed(pct % 1 === 0 ? 0 : 1) + "%";
          const subText = quota.resetsInSec === null ? usageText : "重置 " + fmtCountdown(quota.resetsInSec);

          return `
            <div class="quota-tile">
              <div class="quota-tile-top">
                <span class="quota-label">${escHtml(b.label)}</span>
                ${syncButton}
              </div>
              <div class="quota-tile-mid">
                <div class="ring-wrap">
                  <svg viewBox="0 0 42 42">
                    <circle class="ring-track" cx="21" cy="21" r="16"/>
                    <circle class="ring-fill" cx="21" cy="21" r="16" stroke="${color}"
                      stroke-dasharray="${circum.toFixed(2)}" stroke-dashoffset="${offset.toFixed(2)}"/>
                  </svg>
                </div>
                <div class="quota-meta">
                  <div class="quota-big tabular">${escHtml(bigText)}</div>
                  <div class="quota-sub tabular" title="${escHtml(subText)}">${escHtml(subText)}</div>
                </div>
              </div>
              <div class="quota-tile-foot tabular">
                <span>${escHtml(b.shortLabel)} ${fmtTokens(b.windowUsage.totalTokens, true)}</span>
                <span>${b.windowUsage.calls} 次调用</span>
              </div>
            </div>
          `;
        }).join("");
        document.getElementById("primaryQuotas").innerHTML = primaryHtml;

        function renderGroupBox(title, list) {
          const miniC = 2 * Math.PI * 8; // r=8 -> 50.27
          const rows = list.map((b) => {
            const quota = b.quota;
            const pct = quota.remainingPct;
            const color = quotaColor(pct);
            const offset = pct === null ? miniC : miniC * (1 - Math.max(0, Math.min(100, pct)) / 100);

            const metaParts = [b.shortLabel + " " + fmtTokens(b.windowUsage.totalTokens, true) + " tok"];
            if (quota.resetsInSec !== null) metaParts.push("重置 " + fmtCountdown(quota.resetsInSec));

            const rightMetric = pct === null
              ? `<span class="mini-pct" style="color:var(--text-secondary);font-weight:600;font-size:11.5px;">暂不可用</span>`
              : `<span class="mini-pct tabular" style="color:var(--text-primary)">${escHtml(Math.round(pct) + "%")}</span>
                 <svg class="mini-ring" viewBox="0 0 22 22">
                   <circle cx="11" cy="11" r="8" fill="none" stroke="rgba(148,163,184,0.18)" stroke-width="2.6"/>
                   <circle cx="11" cy="11" r="8" fill="none" stroke="${color}" stroke-width="2.6"
                     stroke-linecap="round" stroke-dasharray="${miniC.toFixed(2)}" stroke-dashoffset="${offset.toFixed(2)}"/>
                 </svg>`;

            return `
              <div class="bucket-row">
                <div class="bucket-row-left">
                  <div class="bucket-row-title">
                    <span>${escHtml(b.label)}</span>
                  </div>
                  <div class="bucket-row-meta tabular">${escHtml(metaParts.join(" · "))}</div>
                </div>
                <div class="bucket-row-right">
                  ${rightMetric}
                  ${syncButton}
                </div>
              </div>
            `;
          }).join("");

          return `
            <div class="extra-group">
              <div class="extra-group-head">
                <span class="extra-group-name">${escHtml(title)}</span>
              </div>
              ${rows}
            </div>
          `;
        }

        document.getElementById("extraQuotas").innerHTML =
          renderGroupBox("Claude & GPT models", claudeGpt) +
          renderGroupBox("Gemini 4 Argon", argon);
        updateQuotaSyncButtons();
      }

      function renderCalendar(d) {
        const cal = d.calendar;
        if (!cal) return;
        state.calendarYear = cal.year;
        state.calendarMonth = cal.month;
        document.getElementById("calMonthTitle").textContent = cal.year + "年" + cal.month + "月";

        const cells = [];
        for (let i = 0; i < (cal.firstWeekday || 0); i++) {
          cells.push('<div class="cal-day empty"></div>');
        }
        for (const dayObj of cal.days || []) {
          const classes = ["cal-day", "tabular", "lvl-" + dayObj.level];
          if (dayObj.isToday) classes.push("today");
          if (state.selectedDay === dayObj.day) classes.push("selected");
          cells.push(
            `<div class="${classes.join(" ")}" data-day="${dayObj.day}" title="${cal.month}月${dayObj.day}日: ${fmtTokens(dayObj.total, true)} tok">${dayObj.day}</div>`
          );
        }
        document.getElementById("calGrid").innerHTML = cells.join("");

        const picked = (cal.days || []).find((x) => x.day === state.selectedDay) ||
                       (cal.days || []).find((x) => x.isToday);
        const detailEl = document.getElementById("calDetail");
        if (picked) {
          detailEl.innerHTML = `
            <strong>${cal.month}月${picked.day}日 · ${fmtTokens(picked.total)} tok</strong>
            <span>未缓存 ${fmtTokens(picked.uncachedInput, true)} · 缓存 ${fmtTokens(picked.cacheRead, true)} · 输出 ${fmtTokens(picked.output, true)} · ${picked.calls}次</span>
          `;
        } else {
          detailEl.textContent = "本月累计 " + fmtTokens(cal.monthSelectedTotal) + " tok · 点击日期查看明细";
        }
      }

      function renderModelBreakdown(d) {
        const list = d.modelBreakdown || [];
        const wrap = document.getElementById("modelBreakdownWrap");
        if (!list.length) {
          wrap.innerHTML = "";
          return;
        }
        const maxTok = Math.max(...list.map((m) => m.totalTokens), 1);
        const rows = list.slice(0, 6).map((m) => {
          const w = Math.max(4, Math.round((m.totalTokens / maxTok) * 100));
          return `
            <div class="model-item">
              <div class="model-item-top tabular">
                <span>${escHtml(m.displayName)}</span>
                <span>${fmtTokens(m.totalTokens, true)} tok (${m.calls}次)</span>
              </div>
              <div class="model-bar-track">
                <div class="model-bar-fill" style="width:${w}%"></div>
              </div>
            </div>
          `;
        }).join("");
        wrap.innerHTML = `
          <div class="section-label"><span>按模型用量分布</span></div>
          <div class="model-list">${rows}</div>
        `;
      }

      function renderContextCard(d) {
        const sess = d.session;
        const recent = d.recentSessions || [];
        const triggerTitleEl = document.getElementById("sessionTriggerTitle");
        const liveDotEl = document.getElementById("sessionLiveDot");
        const menuEl = document.getElementById("sessionMenu");
        const followEl = document.getElementById("followToggle");

        followEl.checked = !!(d.preferences && d.preferences.followActiveSession);

        if (recent.length) {
          const currentId = sess ? sess.conversationId : recent[0].conversationId;
          const currentItem = recent.find((s) => s.conversationId === currentId) || recent[0];
          const isLive = currentItem.conversationId === d.activeSessionHintId;
          liveDotEl.style.display = isLive ? "inline-block" : "none";
          triggerTitleEl.textContent = currentItem.title;
          triggerTitleEl.title = currentItem.title;

          menuEl.innerHTML = recent.map((s) => {
            const isSelected = s.conversationId === currentId;
            const isActiveLive = s.conversationId === d.activeSessionHintId;
            return `
              <button type="button" class="session-option ${isSelected ? "active" : ""}" data-session-id="${escHtml(s.conversationId)}" role="option" aria-selected="${isSelected ? "true" : "false"}">
                <div class="session-option-main">
                  <div class="session-option-title">
                    ${isActiveLive ? '<span class="live-indicator" title="当前活跃会话"></span>' : ""}
                    <span title="${escHtml(s.title)}">${escHtml(s.title)}</span>
                  </div>
                  <div class="session-option-sub">${escHtml(s.modelDisplay || "")}</div>
                </div>
                <div class="session-option-right tabular">
                  <span>${fmtTokens(s.contextTokens, true)}</span>
                  ${isSelected ? '<span class="session-check">✓</span>' : ""}
                </div>
              </button>
            `;
          }).join("");
        } else {
          liveDotEl.style.display = "none";
          triggerTitleEl.textContent = "暂无可读取的会话日志";
          menuEl.innerHTML = '<div class="empty-state" style="padding:12px;">暂无历史会话</div>';
        }

        const ringFill = document.getElementById("ctxRingFill");
        const circum = 2 * Math.PI * 19; // 119.38

        if (!sess) {
          document.getElementById("ctxRingPct").textContent = "--%";
          document.getElementById("ctxTitleText").textContent = "等待会话数据";
          document.getElementById("ctxRatioText").textContent = "0 / 1M";
          document.getElementById("ctxModelBadge").textContent = "未检测到会话";
          document.getElementById("ctxCacheQuick").textContent = "";
          ringFill.setAttribute("stroke-dashoffset", circum.toFixed(2));
          document.getElementById("contextDetailsBody").innerHTML =
            '<div class="empty-state">发一条消息后，上下文消耗与缓存命中率将在此实时显示。</div>';
          return;
        }

        const ctx = sess.context;
        const tok = sess.tokens;
        const st = sess.stats;
        const pct = Math.max(0, Math.min(100, Number(ctx.usedPct || 0)));
        const color = contextColor(pct);
        const offset = circum * (1 - pct / 100);

        ringFill.setAttribute("stroke", color);
        ringFill.setAttribute("stroke-dashoffset", offset.toFixed(2));
        document.getElementById("ctxRingPct").textContent = Math.round(pct) + "%";
        document.getElementById("ctxTitleText").textContent = "上下文已用 " + pct + "%";
        document.getElementById("ctxRatioText").textContent =
          fmtTokens(ctx.usedTokens, true) + " / " + fmtTokens(ctx.limitTokens, true);
        document.getElementById("ctxModelBadge").textContent = sess.modelDisplay;
        document.getElementById("ctxCacheQuick").textContent = "缓存命中 " + tok.cacheHitPct + "%";

        const bd = ctx.breakdown || {};
        const denom = Math.max(ctx.usedTokens, 1);
        const wSys = Math.round(((bd.systemAndTools || 0) / denom) * 100);
        const wDial = Math.round(((bd.dialogue || 0) / denom) * 100);
        const wTools = Math.max(0, 100 - wSys - wDial);

        document.getElementById("contextDetailsBody").innerHTML = `
          <div class="section-label">
            <span>上下文构成</span>
          </div>
          <div class="seg-bar">
            <div class="seg-sys" style="width:${wSys}%"></div>
            <div class="seg-dial" style="width:${wDial}%"></div>
            <div class="seg-tools" style="width:${wTools}%"></div>
          </div>
          <div class="breakdown-list tabular">
            <div class="breakdown-item">
              <span class="breakdown-left"><span class="dot seg-sys"></span>系统提示词与工具定义</span>
              <span>~${fmtTokens(bd.systemAndTools, true)}</span>
            </div>
            <div class="breakdown-item">
              <span class="breakdown-left"><span class="dot seg-dial"></span>对话消息与思考内容</span>
              <span>~${fmtTokens(bd.dialogue, true)}</span>
            </div>
            <div class="breakdown-item">
              <span class="breakdown-left"><span class="dot seg-tools"></span>工具输出与历史上下文</span>
              <span>~${fmtTokens(bd.toolOutputs, true)}</span>
            </div>
          </div>

          <div class="section-label"><span>会话统计</span><span>${st.plannerCalls} 次模型调用</span></div>
          <div class="stats-grid tabular">
            <div class="stat-box">
              <div class="stat-box-label">对话轮数 / 工具</div>
              <div class="stat-box-val">${st.turnCount} 轮 · ${st.toolCallCount} 次</div>
            </div>
            <div class="stat-box">
              <div class="stat-box-label">平均输出速率</div>
              <div class="stat-box-val">${st.avgOutputTps > 0 ? st.avgOutputTps + " tok/s" : "—"}</div>
            </div>
          </div>

          <div class="section-label"><span>Token 用量</span><span>合计 ${fmtTokens(tok.total)} tok</span></div>
          <div class="stats-grid tabular" style="margin-bottom:0;">
            <div class="stat-box">
              <div class="stat-box-label">缓存命中</div>
              <div class="stat-box-val emerald">${tok.cacheHitPct}%</div>
            </div>
            <div class="stat-box">
              <div class="stat-box-label">未缓存输入</div>
              <div class="stat-box-val">${fmtTokens(tok.uncachedInput)} tok</div>
            </div>
            <div class="stat-box">
              <div class="stat-box-label">缓存读取</div>
              <div class="stat-box-val">${fmtTokens(tok.cacheRead)} tok</div>
            </div>
            <div class="stat-box">
              <div class="stat-box-label">输出</div>
              <div class="stat-box-val">${fmtTokens(tok.output)} tok</div>
            </div>
          </div>
        `;
      }

      function syncExpandStates() {
        const qBtn = document.getElementById("quotaExpandBtn");
        const qDrawer = document.getElementById("quotaDrawer");
        qDrawer.classList.toggle("open", state.quotaExpanded);
        qBtn.classList.toggle("expanded", state.quotaExpanded);
        qBtn.querySelector("span").textContent = state.quotaExpanded
          ? "收起详情"
          : "展开详情 · Claude & GPT · Argon · 每日用量日历";

        const cDrawer = document.getElementById("contextDrawer");
        const cCard = document.getElementById("contextCard");
        cDrawer.classList.toggle("open", state.contextExpanded);
        cCard.classList.toggle("expanded", state.contextExpanded);
      }

      // ================================================================
      // 4. 数据刷新与事件绑定
      // ================================================================
      function updateQuotaSyncButtons() {
        document.querySelectorAll("#quotaCard [data-quota-sync]").forEach((button) => {
          button.disabled = state.quotaSyncing || (!isEmbedded && !isHttpPreview);
          button.textContent = state.quotaSyncing ? "同步中…" : "同步";
        });
      }

      async function refreshDashboard(spin, forceQuotaRefresh = false) {
        if (forceQuotaRefresh && state.quotaSyncing) return;
        const requestId = ++state.refreshRequestId;
        const btn = document.getElementById("refreshBtn");
        if (spin) btn.classList.add("spinning");
        if (forceQuotaRefresh) {
          state.quotaSyncing = true;
          updateQuotaSyncButtons();
        }
        try {
          const args = {};
          if (state.selectedConversationId) args.conversationId = state.selectedConversationId;
          if (state.calendarYear) args.year = state.calendarYear;
          if (state.calendarMonth) args.month = state.calendarMonth;
          if (forceQuotaRefresh) args.forceQuotaRefresh = true;
          const fresh = await callServerTool("app_get_dashboard", args);
          if (requestId !== state.refreshRequestId) return;
          if (fresh) {
            state.dashboard = fresh;
            renderAll();
          } else if (forceQuotaRefresh) {
            throw new Error("Missing dashboard response");
          }
        } catch (err) {
          console.error(err);
          if (forceQuotaRefresh && requestId === state.refreshRequestId) {
            const badge = document.getElementById("quotaSourceBadge");
            badge.textContent = "同步失败";
            badge.className = "badge";
          }
        } finally {
          if (forceQuotaRefresh) {
            state.quotaSyncing = false;
            updateQuotaSyncButtons();
          }
          if (spin) setTimeout(() => btn.classList.remove("spinning"), 260);
        }
      }

      function bindEvents() {
        document.getElementById("quotaExpandBtn").addEventListener("click", () => {
          state.quotaExpanded = !state.quotaExpanded;
          syncExpandStates();
          requestAnimationFrame(reportSize);
        });

        document.getElementById("contextHero").addEventListener("click", () => {
          state.contextExpanded = !state.contextExpanded;
          syncExpandStates();
          requestAnimationFrame(reportSize);
        });

        document.getElementById("refreshBtn").addEventListener("click", () => refreshDashboard(true));
        document.getElementById("updateBtn").addEventListener("click", () => openUpdateModal());
        document.getElementById("updateCloseBtn").addEventListener("click", closeUpdateModal);
        document.getElementById("updateRecheckBtn").addEventListener("click", () => runUpdateCheck());
        document.getElementById("updateApplyBtn").addEventListener("click", () => runApplyUpdate());
        document.getElementById("updateModalBackdrop").addEventListener("click", (e) => {
          if (e.target.id === "updateModalBackdrop" && !state.updateBusy) closeUpdateModal();
        });
        document.getElementById("quotaCard").addEventListener("click", (e) => {
          const button = e.target.closest("[data-quota-sync]");
          if (button && !button.disabled) refreshDashboard(true, true);
        });

        document.getElementById("unitToggleBtn").addEventListener("click", async () => {
          const next = unitMode() === "compact" ? "exact" : "compact";
          const fresh = await callServerTool("app_update_preferences", {
            unitMode: next,
            conversationId: state.selectedConversationId || undefined,
            year: state.calendarYear || undefined,
            month: state.calendarMonth || undefined,
          });
          if (fresh) {
            state.dashboard = fresh;
            renderAll();
          }
        });

        const pickerEl = document.getElementById("sessionPicker");
        const triggerEl = document.getElementById("sessionTrigger");
        const menuEl = document.getElementById("sessionMenu");

        function closeSessionMenu() {
          pickerEl.classList.remove("open");
          triggerEl.setAttribute("aria-expanded", "false");
        }

        triggerEl.addEventListener("click", (e) => {
          e.stopPropagation();
          const opening = !pickerEl.classList.contains("open");
          pickerEl.classList.toggle("open", opening);
          triggerEl.setAttribute("aria-expanded", opening ? "true" : "false");
        });

        menuEl.addEventListener("click", (e) => {
          const opt = e.target.closest("[data-session-id]");
          if (!opt) return;
          e.stopPropagation();
          state.selectedConversationId = opt.getAttribute("data-session-id") || null;
          closeSessionMenu();
          refreshDashboard(false);
        });

        document.addEventListener("click", (e) => {
          if (!pickerEl.contains(e.target)) {
            closeSessionMenu();
          }
        });

        document.addEventListener("keydown", (e) => {
          if (e.key === "Escape") {
            closeSessionMenu();
            if (!state.updateBusy) closeUpdateModal();
          }
        });

        document.getElementById("followToggle").addEventListener("change", async (e) => {
          const checked = !!e.target.checked;
          if (checked) state.selectedConversationId = null;
          const fresh = await callServerTool("app_update_preferences", {
            followActiveSession: checked,
            year: state.calendarYear || undefined,
            month: state.calendarMonth || undefined,
          });
          if (fresh) {
            state.dashboard = fresh;
            renderAll();
          }
        });

        document.getElementById("prevMonthBtn").addEventListener("click", () => {
          if (!state.calendarYear || !state.calendarMonth) return;
          state.selectedDay = null;
          if (state.calendarMonth === 1) {
            state.calendarYear -= 1;
            state.calendarMonth = 12;
          } else {
            state.calendarMonth -= 1;
          }
          refreshDashboard(false);
        });

        document.getElementById("nextMonthBtn").addEventListener("click", () => {
          if (!state.calendarYear || !state.calendarMonth) return;
          state.selectedDay = null;
          if (state.calendarMonth === 12) {
            state.calendarYear += 1;
            state.calendarMonth = 1;
          } else {
            state.calendarMonth += 1;
          }
          refreshDashboard(false);
        });

        document.getElementById("calGrid").addEventListener("click", (e) => {
          const cell = e.target.closest(".cal-day[data-day]");
          if (!cell) return;
          state.selectedDay = Number(cell.getAttribute("data-day"));
          renderCalendar(state.dashboard);
        });
      }

      // ================================================================
      // 5.5 手动检查更新与一键原地更新
      // ================================================================
      function openUpdateModal() {
        document.getElementById("updateModalBackdrop").classList.add("open");
        runUpdateCheck();
      }

      function closeUpdateModal() {
        document.getElementById("updateModalBackdrop").classList.remove("open");
      }

      async function runUpdateCheck() {
        if (state.updateBusy) return;
        state.updateBusy = true;
        state.latestUpdateInfo = null;

        const verRow = document.getElementById("updateVerRow");
        const statusEl = document.getElementById("updateStatusText");
        const notesEl = document.getElementById("updateNotesBox");
        const applyBtn = document.getElementById("updateApplyBtn");
        const recheckBtn = document.getElementById("updateRecheckBtn");

        recheckBtn.disabled = true;
        applyBtn.style.display = "none";
        notesEl.style.display = "none";
        statusEl.className = "update-status";
        statusEl.textContent = "正在连接 GitHub 查询最新 Release…";
        verRow.innerHTML = '<span>当前版本：<strong>v0.2.0</strong></span><span style="color:var(--text-muted)">查询中…</span>';

        try {
          const info = await callServerTool("app_check_update", {});
          if (!info || !info.ok) {
            statusEl.className = "update-status err";
            statusEl.textContent = (info && info.error) || "检查更新失败，请稍后重试。";
            verRow.innerHTML = `<span>当前版本：<strong>v${escHtml((info && info.currentVersion) || "0.2.0")}</strong></span><span style="color:var(--rose)">查询失败</span>`;
            return;
          }
          state.latestUpdateInfo = info;
          verRow.innerHTML = `<span>当前版本：<strong>v${escHtml(info.currentVersion)}</strong></span><span>最新版本：<strong style="color:${info.hasUpdate ? "var(--emerald)" : "var(--text-primary)"}">v${escHtml(info.latestVersion)}</strong></span>`;
          if (info.hasUpdate) {
            statusEl.className = "update-status ok";
            statusEl.textContent = "发现新版本：" + (info.releaseTitle || ("v" + info.latestVersion)) + "，点击下方按钮即可原地安全更新（自动备份旧版）。";
            if (info.releaseNotes) {
              notesEl.textContent = info.releaseNotes;
              notesEl.style.display = "block";
            }
            applyBtn.textContent = "一键更新到 v" + info.latestVersion;
            applyBtn.disabled = false;
            applyBtn.style.display = "inline-flex";
          } else {
            statusEl.className = "update-status ok";
            statusEl.textContent = "当前已是最新版本，无需更新。";
          }
        } catch (err) {
          statusEl.className = "update-status err";
          statusEl.textContent = "检查更新异常：" + (err && err.message ? err.message : String(err));
        } finally {
          state.updateBusy = false;
          recheckBtn.disabled = false;
        }
      }

      async function runApplyUpdate() {
        const info = state.latestUpdateInfo;
        if (!info || !info.downloadUrl || state.updateBusy) return;
        state.updateBusy = true;

        const statusEl = document.getElementById("updateStatusText");
        const applyBtn = document.getElementById("updateApplyBtn");
        const recheckBtn = document.getElementById("updateRecheckBtn");
        const closeBtn = document.getElementById("updateCloseBtn");

        applyBtn.disabled = true;
        recheckBtn.disabled = true;
        closeBtn.disabled = true;
        applyBtn.textContent = "正在更新…";
        statusEl.className = "update-status";
        statusEl.textContent = "正在从 GitHub 下载更新包、校验并备份旧版本…";

        try {
          const res = await callServerTool("app_apply_update", { downloadUrl: info.downloadUrl });
          if (!res || !res.ok) {
            statusEl.className = "update-status err";
            statusEl.textContent = (res && res.error) || "更新失败，旧版本未受影响。";
            applyBtn.disabled = false;
            applyBtn.textContent = "重试更新";
            return;
          }
          statusEl.className = "update-status ok";
          statusEl.textContent = res.message || ("已更新至 v" + res.updatedVersion);
          applyBtn.style.display = "none";
          if (!res.backendChanged) {
            setTimeout(() => location.reload(), 1100);
          }
        } catch (err) {
          statusEl.className = "update-status err";
          statusEl.textContent = "更新请求失败：" + (err && err.message ? err.message : String(err));
          applyBtn.disabled = false;
          applyBtn.textContent = "重试更新";
        } finally {
          state.updateBusy = false;
          recheckBtn.disabled = false;
          closeBtn.disabled = false;
        }
      }

      // ================================================================
      // 6. 启动初始化
      // ================================================================
      async function boot() {
        bindEvents();

        if (isEmbedded) {
          try {
            const initRes = await sendHostRequest("ui/initialize", {
              appInfo: { name: "antigravity-quota-monitor", version: "0.2.0" },
              appCapabilities: {},
              protocolVersion: "2026-01-26",
            });
            mcpConnected = true;
            if (initRes && initRes.hostContext) {
              applyHostContext(initRes.hostContext);
            }
            postToHost({ jsonrpc: "2.0", method: "ui/notifications/initialized", params: {} });
          } catch (err) {
            console.error("MCP Apps handshake failed:", err);
          }
        }

        // 若宿主尚未推送 tool-result，主动拉取最新快照
        if (!state.dashboard) {
          await refreshDashboard(false);
        }

        // 会话选择、手动同步或更新弹窗期间暂停定时刷新。
        state.refreshTimer = setInterval(() => {
          const menuOpen = document.getElementById("sessionPicker").classList.contains("open");
          const updateOpen = document.getElementById("updateModalBackdrop").classList.contains("open");
          if (!state.quotaSyncing && !menuOpen && !updateOpen) {
            refreshDashboard(false);
          }
        }, 15000);

        if (typeof ResizeObserver !== "undefined") {
          const ro = new ResizeObserver(() => reportSize());
          ro.observe(document.body);
        }
      }

      boot();
    })();
